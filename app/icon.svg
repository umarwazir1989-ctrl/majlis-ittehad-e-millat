  <!-- open book -->
  <path d="M145 319c43-12 78-7 111 21v55c-34-22-70-29-111-15z" fill="#fffdf8"/>
  <path d="M367 319c-43-12-78-7-111 21v55c34-22 70-29 111-15z" fill="#fffdf8"/>
  <path d="M256 341v55" stroke="#b58a43" stroke-width="8" stroke-linecap="round"/>

  <!-- three united figures -->
  <circle cx="256" cy="257" r="25" fill="url(#gold)"/>
  <circle cx="202" cy="276" r="18" fill="#fffdf8"/>
  <circle cx="310" cy="276" r="18" fill="#fffdf8"/>
  <path d="M219 324c4-34 17-49 37-49s33 15 37 49" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <path d="M166 319c2-24 14-35 36-35 12 0 22 5 30 15" fill="none" stroke="#fffdf8" stroke-width="16" stroke-linecap="round"/>
  <path d="M346 319c-2-24-14-35-36-35-12 0-22 5-30 15" fill="none" stroke="#fffdf8" stroke-width="16" stroke-linecap="round"/>

  <!-- stylized Arabic meem / unity line -->
