<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">مجلس اتحادِ ملت</title>
  <desc id="desc">سبز اور سنہری اسلامی طرز کا علمی و وحدتی نشان</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4b3d"/>
      <stop offset="1" stop-color="#142f43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c07a"/>
      <stop offset="1" stop-color="#b58a43"/>
    </linearGradient>
  </defs>

  <path d="M256 36c58 54 103 81 143 119v156c0 88-64 137-143 165-79-28-143-77-143-165V155c40-38 85-65 143-119z"
